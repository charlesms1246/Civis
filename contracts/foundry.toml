[profile.default]
src = "src"
out = "out"
libs = ["lib", "dependencies"]
evm_version = "london"
fs_permissions = [
  { access = "read", path = "./testdata" },
  { access = "write", path = "./deployments" }
]

[dependencies]
"@openzeppelin-contracts" = "5.0.1"
forge-std = "1.9.4"
risc0-ethereum = { version = "2.0.0", url = "https://github.com/vlayer-xyz/risc0-ethereum/releases/download/v2.0.0-soldeer/contracts.zip" }
solady = "0.0.230"
vlayer = "1.0.2"

[soldeer]
# whether soldeer manages remappings
remappings_generate = false
# whether soldeer re-generates all remappings when installing, updating or uninstalling deps
remappings_regenerate = false

[rpc_endpoints]
creditcoin_testnet = "https://rpc.cc3-testnet.creditcoin.network"
anvil_local = "http://127.0.0.1:8545"

[etherscan]
creditcoin_testnet = { key = "any", url = "https://creditcoin-testnet.blockscout.com/api" }

